name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # no packageManager field in package.json, so the major is pinned here
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        # tools/ pulls in onnxruntime-node, whose postinstall downloads the
        # CUDA build (hundreds of MB) on linux-x64. Nothing here needs it.
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: |
          pnpm run typecheck
          pnpm -C server typecheck
      - name: Client tests
        run: pnpm test
      # no secrets needed: Pixabay calls are stubbed, R2 stays unset, and the
      # sockets and HTTP calls only talk to a server on localhost
      - name: Server tests
        run: pnpm -C server test
      - name: Build
        run: pnpm run build
